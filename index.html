<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Subway Cleaners 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#83c9e8;font-family:Arial}
canvas{display:block}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;color:white;font-size:19px;font-weight:bold;text-shadow:0 2px 5px black;pointer-events:none}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#071522bb;z-index:5;color:white;text-align:center}
.panel{background:#142e45;padding:26px;border-radius:20px;width:90%;max-width:380px}
button{border:0;border-radius:14px;padding:14px 20px;margin:6px;background:#ffd32a;color:#17212a;font-size:18px;font-weight:bold;cursor:pointer}
#controls{position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px}
#controls button{width:58px;height:58px;border-radius:50%;background:#ffffffbb;font-size:23px}
</style>
</head>
<body>

<div id="hud">
 <div>⭐ Score: <span id="score">0</span></div>
 <div>🗑️ Trash: <span id="trashCount">0</span></div>
</div>

<div id="menu">
 <div class="panel">
  <h1 id="heading">SUBWAY CLEANERS</h1>
  <p id="message">Collect trash and save the subway!</p>
  <button id="play">PLAY NOW</button>
  <p>Desktop: Arrow keys or WASD</p>
  <p>Mobile: Swipe or use buttons</p>
 </div>
</div>

<div id="controls">
 <div>
  <button onclick="move(-1)">◀</button>
  <button onclick="move(1)">▶</button>
 </div>
 <div>
  <button onclick="jump()">⬆</button>
  <button onclick="slide()">⬇</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
if(!window.THREE){
 document.getElementById("message").textContent="3D library could not load. Check your internet.";
 document.getElementById("play").style.display="none";
 throw new Error("Three.js unavailable");
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8bcbe8);
scene.fog=new THREE.Fog(0x8bcbe8,35,100);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);
camera.position.set(0,5,11);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526477,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-5,12,8);
sun.castShadow=true;
scene.add(sun);

function mat(color,roughness=.7,transparent=false,opacity=1){
 return new THREE.MeshStandardMaterial({color,roughness,transparent,opacity});
}

function box(parent,w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

// TRACK
box(scene,18,.3,120,0x444c55,0,-.3,-35);
for(let x of [-3.5,0,3.5]){
 box(scene,.12,.1,120,0x9da5a9,x,-.08,-35);
}
for(let z=10;z>-100;z-=3){
 for(let x of [-2,2]){
  box(scene,.14,.12,1.5,0x777777,x,-.05,z);
 }
}

// STATION
for(let side of [-1,1]){
 box(scene,.5,6,100,0x647d88,side*8,2,-35);
 for(let i=0;i<16;i++){
  let h=7+Math.random()*10;
  box(scene,5,h,5,0x728c9b,side*13,h/2,5-i*7);
 }
}
for(let z=10;z>-100;z-=12){
 box(scene,16,.25,.35,0x354c5d,0,6,z);
}

// DETAILED CHARACTERS
function person(color){
 const g=new THREE.Group();
 const legs=[];
 const clothes=mat(color);
 const skin=mat(0xffc69c);
 const dark=mat(0x202d40);

 // Body
 const body=new THREE.Mesh(
  new THREE.CapsuleGeometry(.34,.65,8,20),clothes
 );
 body.position.y=1.1;
 g.add(body);

 // Jacket zipper
 box(g,.035,.65,.035,0xe8e8e8,0,1.15,.34);

 // Head
 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.27,32,24),skin
 );
 head.position.y=1.88;
 g.add(head);

 // Hair
 const hair=new THREE.Mesh(
  new THREE.SphereGeometry(.275,24,16,0,Math.PI*2,0,Math.PI*.48),
  mat(color===0x1688ed?0x302015:0x171717)
 );
 hair.position.y=2.02;
 g.add(hair);

 // Eyes
 for(let x of [-.105,.105]){
  const eye=new THREE.Mesh(
   new THREE.SphereGeometry(.035,12,12),
   mat(0x171717)
  );
  eye.position.set(x,1.91,.235);
  g.add(eye);
 }

 // Smile
 box(g,.09,.018,.018,0x8c3434,0,1.79,.25);

 // Arms and hands
 for(let s of [-1,1]){
  const arm=new THREE.Mesh(
   new THREE.CapsuleGeometry(.105,.48,6,12),clothes
  );
  arm.position.set(s*.42,1.12,0);
  arm.rotation.z=-s*.18;
  g.add(arm);

  const hand=new THREE.Mesh(
   new THREE.SphereGeometry(.12,16,12),skin
  );
  hand.position.set(s*.46,.77,.02);
  g.add(hand);
 }

 // Legs and shoes
 for(let s of [-1,1]){
  const leg=new THREE.Mesh(
   new THREE.CapsuleGeometry(.13,.43,6,12),dark
  );
  leg.position.set(s*.17,.39,0);
  g.add(leg);
  legs.push(leg);

  box(g,.29,.17,.43,0xffffff,s*.17,.12,.12);
 }

 // Backpack
 box(g,.52,.62,.2,
  color===0x1688ed?0xffa522:0x333333,0,1.13,-.34);
 box(g,.35,.12,.04,0xdddddd,0,.92,-.45);

 // Inspector badge
 if(color!==0x1688ed){
  box(g,.16,.18,.035,0xffd32a,.23,1.35,.34);
 }

 scene.add(g);
 return {group:g,legs};
}

const hero=person(0x1688ed);
const guard=person(0x303030);
hero.group.position.z=3;
guard.group.position.z=8;

// GAME VARIABLES
let objects=[];
let lane=0,score=0,trashCount=0;
let running=false,jumping=false,sliding=false;
let jumpTime=0,slideTime=0;
let speed=13,spawnTimer=0,guardDistance=5;
let lastTime=0,scoreTimer=0;

const scoreEl=document.getElementById("score");
const trashEl=document.getElementById("trashCount");
const menu=document.getElementById("menu");
const playButton=document.getElementById("play");

// TRASH
function addTrash(type,l,z){
 const g=new THREE.Group();

 if(type==="paper"){
  const paper=new THREE.Mesh(
   new THREE.IcosahedronGeometry(.35,1),mat(0xf0eee5)
  );
  paper.scale.set(1,.65,.9);
  paper.position.y=.35;
  g.add(paper);

 }else if(type==="cup"){
  const cup=new THREE.Mesh(
   new THREE.CylinderGeometry(.22,.15,.55,20),mat(0xe8f3f5)
  );
  cup.position.y=.4;
  g.add(cup);

  const rim=new THREE.Mesh(
   new THREE.TorusGeometry(.21,.025,8,20),mat(0xffffff)
  );
  rim.position.y=.68;
  g.add(rim);

 }else if(type==="bottle"){
  const bottle=new THREE.Group();

  const body=new THREE.Mesh(
   new THREE.CylinderGeometry(.14,.16,.65,20),
   mat(0x65c9e8,.2,true,.8)
  );
  bottle.add(body);

  const neck=new THREE.Mesh(
   new THREE.CylinderGeometry(.07,.1,.16,16),mat(0x65c9e8)
  );
  neck.position.y=.4;
  bottle.add(neck);

  const cap=new THREE.Mesh(
   new THREE.CylinderGeometry(.075,.075,.09,12),mat(0x2456a0)
  );
  cap.position.y=.53;
  bottle.add(cap);

  bottle.position.y=.45;
  bottle.rotation.z=Math.PI/2;
  g.add(bottle);

 }else if(type==="can"){
  const can=new THREE.Mesh(
   new THREE.CylinderGeometry(.17,.17,.5,20),mat(0xc5cbd1,.3)
  );
  can.position.y=.35;
  g.add(can);

  const top=new THREE.Mesh(
   new THREE.CylinderGeometry(.15,.15,.025,20),mat(0x777777)
  );
  top.position.y=.61;
  g.add(top);
 }

 g.position.set(l*3.5,0,z);
 scene.add(g);
 objects.push({group:g,type:"trash",lane:l,z});
}

// COLORFUL OBSTACLES
function obstacle(type,l,z){
 const g=new THREE.Group();

 if(type==="train"){
  box(g,2.7,3.8,8,0xc93636,0,2,0);

  for(let y of [2.4,3.2]){
   box(g,1.9,.5,.08,0x9ceaff,0,y,-4.05);
  }

 }else if(type==="jump"){
  // Low colorful jumping barrier
  box(g,2.5,.85,.8,0xff8c00,0,.45,0);

  const colors=[0xff3030,0xffdf32,0x25d366,0x2196ff,0xff30c8];

  for(let i=0;i<5;i++){
   box(g,.28,.9,.84,colors[i],-1+i*.5,.45,0);
  }

  for(let x of [-.95,.95]){
   const light=new THREE.Mesh(
    new THREE.SphereGeometry(.12,16,12),
    new THREE.MeshStandardMaterial({
     color:0xffffff,emissive:0xffcc00,emissiveIntensity:2
    })
   );
   light.position.set(x,.9,.1);
   g.add(light);
  }

 }else{
  // High colorful sliding barrier
  box(g,2.7,.65,.8,0x7b2cff,0,2.7,0);

  const colors=[0xff3030,0xffdf32,0x25d366,0x2196ff,0xff30c8];

  for(let i=0;i<5;i++){
   box(g,.42,.68,.85,colors[i],-1.08+i*.54,2.7,0);
  }

  for(let x of [-1,0,1]){
   const light=new THREE.Mesh(
    new THREE.SphereGeometry(.13,16,12),
    new THREE.MeshStandardMaterial({
     color:0xffffff,emissive:0x00eaff,emissiveIntensity:2
    })
   );
   light.position.set(x,3.1,.05);
   g.add(light);
  }
 }

 g.position.set(l*3.5,0,z);
 scene.add(g);
 objects.push({group:g,type,lane:l,z,hit:false});
}

function randomTrash(l,z){
 const types=["paper","cup","bottle","can"];
 addTrash(types[Math.floor(Math.random()*types.length)],l,z);
}

function spawn(){
 const l=Math.floor(Math.random()*3)-1;
 const r=Math.random();

 if(r<.4)obstacle("train",l,-65);
 else if(r<.7)obstacle("jump",l,-65);
 else obstacle("slide",l,-65);

 for(let i=-1;i<=1;i++){
  if(Math.random()<.75){
   randomTrash(i,-78-Math.random()*8);
  }
 }
}

// CLEAR OBJECTS
function clearObjects(){
 for(const o of objects)scene.remove(o.group);
 objects.length=0;
}

// START AND RESTART
function startGame(){
 clearObjects();

 lane=0;
 score=0;
 trashCount=0;
 speed=13;
 spawnTimer=0;
 guardDistance=5;
 scoreTimer=0;
 jumping=false;
 sliding=false;
 jumpTime=0;
 slideTime=0;

 hero.group.position.set(0,0,3);
 hero.group.scale.set(1,1,1);
 guard.group.position.set(0,0,8);

 scoreEl.textContent="0";
 trashEl.textContent="0";

 document.getElementById("heading").textContent="SUBWAY CLEANERS";
 document.getElementById("message").textContent="Collect trash and save the subway!";
 playButton.textContent="PLAY NOW";

 menu.style.display="none";
 running=true;
 lastTime=performance.now();
 spawn();
}

function gameOver(){
 if(!running)return;
 running=false;
 menu.style.display="flex";

 document.getElementById("heading").textContent="GAME OVER!";
 document.getElementById("message").textContent=
 "Score: "+score+" | Trash collected: "+trashCount;

 playButton.textContent="PLAY AGAIN";
}

playButton.addEventListener("click",startGame);

// CONTROLS
function move(n){
 if(!running)return;
 lane=Math.max(-1,Math.min(1,lane+n));
}
function jump(){
 if(running&&!jumping&&!sliding){
  jumping=true;jumpTime=0;
 }
}
function slide(){
 if(running&&!jumping&&!sliding){
  sliding=true;slideTime=0;
 }
}

window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(k==="arrowleft"||k==="a")move(-1);
 if(k==="arrowright"||k==="d")move(1);
 if(k==="arrowup"||k==="w"||k===" ")jump();
 if(k==="arrowdown"||k==="s")slide();
});

// TOUCH SWIPES
let touchStart=null;

window.addEventListener("touchstart",e=>{
 touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});

window.addEventListener("touchend",e=>{
 if(!touchStart)return;
 const dx=e.changedTouches[0].clientX-touchStart.x;
 const dy=e.changedTouches[0].clientY-touchStart.y;

 if(Math.max(Math.abs(dx),Math.abs(dy))>25){
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);
  else if(dy<0)jump();
  else slide();
 }
 touchStart=null;
},{passive:true});

// GAME UPDATE
function update(dt,time){
 if(!running)return;

 scoreTimer+=dt;
 if(scoreTimer>=.1){
  score++;
  scoreEl.textContent=score;
  scoreTimer=0;
 }

 hero.group.position.x+=(lane*3.5-hero.group.position.x)*Math.min(1,dt*12);

 if(jumping){
  jumpTime+=dt*2.2;
  hero.group.position.y=Math.sin(Math.min(jumpTime,Math.PI))*1.8;
  if(jumpTime>=Math.PI){
   jumping=false;
   hero.group.position.y=0;
  }
 }

 if(sliding){
  slideTime+=dt;
  hero.group.scale.y=.5;
  if(slideTime>.7){
   sliding=false;
   hero.group.scale.y=1;
  }
 }

 guard.group.position.x+=(hero.group.position.x-guard.group.position.x)*dt*3;
 guardDistance=Math.max(2,guardDistance-dt*.025);
 guard.group.position.z=3+guardDistance;

 hero.legs.forEach((leg,i)=>leg.rotation.x=Math.sin(time*.012+i*3)*.6);
 guard.legs.forEach((leg,i)=>leg.rotation.x=Math.sin(time*.012+i*3)*.6);

 spawnTimer+=dt;
 if(spawnTimer>1.15){
  spawn();
  spawnTimer=0;
 }

 for(let i=objects.length-1;i>=0;i--){
  const o=objects[i];
  o.z+=speed*dt;
  o.group.position.z=o.z;

  if(o.type==="trash"){
   o.group.rotation.y+=dt*1.5;

   if(Math.abs(o.z-3)<1.1&&Math.abs(o.group.position.x-hero.group.position.x)<1.5){
    trashCount++;
    score+=50;
    trashEl.textContent=trashCount;
    scoreEl.textContent=score;
    scene.remove(o.group);
    objects.splice(i,1);
    continue;
   }

  }else if(!o.hit&&Math.abs(o.z-3)<1.1&&o.lane===lane){
   o.hit=true;

   if(o.type==="train"){
    gameOver();
    return;
   }

   if(o.type==="jump"&&!jumping)guardDistance-=1.8;
   if(o.type==="slide"&&!sliding)guardDistance-=1.8;
  }

  if(o.z>15){
   scene.remove(o.group);
   objects.splice(i,1);
  }
 }

 if(guardDistance<=2){
  gameOver();
 }

 camera.position.x+=(hero.group.position.x*.25-camera.position.x)*dt*3;
 camera.lookAt(hero.group.position.x*.2,1,-5);
}

// MAIN LOOP
function animate(time){
 requestAnimationFrame(animate);
 const dt=Math.min((time-lastTime)/1000,.04);
 lastTime=time;
 update(dt,time);
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

// RESIZE
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
